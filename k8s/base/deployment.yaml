apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  labels:
    app: portfolio-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
        azure.workload.identity/use: "true"  # important pour que Workload Identity injecte les éléments nécessaires ds le pod
    spec:
      serviceAccountName: portfolio-app-sa
      containers:
        - name: portfolio-app
          # L'image réelle (registre + tag) est injectée par l'overlay
          # de chaque environnement — ne pas coder d'image ici.
          image: portfolio-app
          securityContext:
            runAsNonRoot: true
            # UID numérique explicite, doit correspondre à celui créé
            # dans le Dockerfile (adduser -u 1001). Sans ça, Kubernetes
            # ne peut pas vérifier qu'un utilisateur nommé "spring" est
            # bien non-root, et bloque le conteneur par sécurité.
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          # Limites de ressources : indispensable en prod
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Probes Spring Boot Actuator (à activer côté app si pas déjà fait :
          # dépendance spring-boot-starter-actuator dans le pom.xml).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: portfolio-app-secrets
