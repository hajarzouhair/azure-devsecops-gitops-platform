apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-secret-provider
  # Pas de namespace codé en dur ici : Kustomize applique automatiquement
  # le bon namespace (dev, staging...) selon l'overlay utilisé.
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # Le cluster a plusieurs identités managées (kubelet identity pour
    # ACR pull + identité du CSI driver pour Key Vault) : il faut donc
    # préciser laquelle utiliser.
    userAssignedIdentityID: "e2663a8f-8e80-4ab6-9361-b32a2cbf9185"
    keyvaultName: "kv-hajarazureproje-dev"
    tenantId: "7e337a63-5c53-4eaa-b9ad-54ecb1cc48f2"
    objects: |
      array:
        - |
          objectName: demo-secret
          objectType: secret
