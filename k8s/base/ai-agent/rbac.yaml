apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-server
  namespace: ai-agent
---
# Lecture seule, limitée au namespace "dev" (là où vit portfolio-app).
# Aucun verbe write (create/update/patch/delete) nulle part.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-mcp-reader
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-mcp-reader-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: Role
  name: k8s-mcp-reader
  apiGroup: rbac.authorization.k8s.io
---
# Lecture seule des nœuds au niveau cluster (nécessaire pour le contexte
# de capacité — cf. l'incident de saturation qu'on vient de traiter).
# Get/list/watch uniquement, aucun accès aux Secrets nulle part.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-node-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-namespace-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-namespace-reader
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-metrics-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-metrics-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-metrics-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-metrics-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-metrics-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-mcp-metrics-reader
  apiGroup: rbac.authorization.k8s.io
