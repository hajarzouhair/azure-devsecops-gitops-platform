apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: k8s-mcp-server }
  template:
    metadata:
      labels: { app: k8s-mcp-server }
    spec:
      serviceAccountName: k8s-mcp-server
      nodeSelector:
        workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: k8s-mcp-server
          image: quay.io/containers/kubernetes_mcp_server:v0.0.58
          args: ["--config", "/etc/mcp/config.toml", "--port", "8080"]
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          volumeMounts:
            - name: config
              mountPath: /etc/mcp
      volumes:
        - name: config
          configMap: { name: k8s-mcp-config }
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp-server
  namespace: ai-agent
spec:
  selector: { app: k8s-mcp-server }
  ports: [{ port: 80, targetPort: 8080 }]
