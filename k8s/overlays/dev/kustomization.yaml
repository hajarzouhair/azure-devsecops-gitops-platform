apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - ../../security/network-policies

images:
  - name: portfolio-app
    # Le tag suit désormais le commit SHA comme en
    # staging — cohérent avec la policy Kyverno "disallow-latest-tag"
    # et bien plus traçable que "latest", même en dev.
    newName: acrhajarazureprojectdev.azurecr.io/portfolio-app
    newTag: 5f72be3f

replicas:
  - name: portfolio-app
    count: 1

labels:
  - pairs:
      environment: dev

