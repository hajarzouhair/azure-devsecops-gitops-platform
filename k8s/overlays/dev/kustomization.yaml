apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
- ../../base
- ../../security/network-policies

    # Le tag suit désormais le commit SHA comme en
    # staging — cohérent avec la policy Kyverno "disallow-latest-tag"
    # et bien plus traçable que "latest", même en dev.
images:
- name: acrhajarazureprojectdev.azurecr.io/portfolio-app
  newName: acrhajarazureprojectdev.azurecr.io/portfolio-app
  newTag: e6854261
- name: portfolio-app
  newName: acrhajarazureprojectdev.azurecr.io/portfolio-app
  newTag: 5f72be3f

replicas:
- count: 1
  name: portfolio-app

labels:
- pairs:
    environment: dev
