# Pod jetable, juste pour valider que le secret Key Vault est bien
# monté via le CSI driver. À supprimer une fois le test fait
# (kubectl delete -f k8s/test-secret-pod.yaml) — ce n'est pas un
# composant permanent du projet.
apiVersion: v1
kind: Pod
metadata:
  name: test-secret-pod
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: demo-secret-provider
