# Sans cette règle, le deny-all bloquerait aussi la résolution DNS,
# et l'application ne pourrait plus rien contacter (même en interne).
# Autorise l'egress vers kube-dns/CoreDNS sur le port 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
