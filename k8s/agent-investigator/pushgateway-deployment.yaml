apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: pushgateway }
  template:
    metadata:
      labels: { app: pushgateway }
    spec:
      # Même nœud "monitoring" que Prometheus lui-même, qui va justement
      # scraper ce Pushgateway.
      nodeSelector:
        workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.9.0
          ports: [{ containerPort: 9091 }]
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: ai-agent
  labels: { app: pushgateway }
spec:
  selector: { app: pushgateway }
  ports: [{ name: http, port: 9091, targetPort: 9091 }]
