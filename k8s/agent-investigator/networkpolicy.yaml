apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-to-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { purpose: mcp-tools }
      ports: [{ protocol: TCP, port: 9090 }]
