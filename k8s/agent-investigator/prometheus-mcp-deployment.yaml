apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp-server
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus-mcp-server }
  template:
    metadata:
      labels: { app: prometheus-mcp-server }
    spec:
      nodeSelector:
        workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: prometheus-mcp-server
          image: ghcr.io/pab1it0/prometheus-mcp-server:1.6.2
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
            - name: PROMETHEUS_MCP_SERVER_TRANSPORT
              value: "http"
            - name: PROMETHEUS_MCP_BIND_HOST
              value: "0.0.0.0"          # 0.0.0.0, pas localhost — sinon injoignable depuis le Service K8s
            - name: PROMETHEUS_MCP_BIND_PORT
              value: "8080"
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp-server
  namespace: ai-agent
spec:
  selector: { app: prometheus-mcp-server }
  ports: [{ port: 80, targetPort: 8080 }]
