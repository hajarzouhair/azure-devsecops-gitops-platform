# Expose les endpoints Actuator nécessaires au monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Endpoint Prometheus
management.endpoint.prometheus.enabled=true

# Health details
management.endpoint.health.show-details=always


# Expose les endpoints nécessaires aux probes K8s et au scraping Prometheus.
# Par défaut, Actuator n'expose que /actuator/health — il faut ajouter
# "prometheus" explicitement, et activer les health groups readiness/liveness
# (utilisés par tes probes dans deployment.yaml).
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Sans cette ligne, Micrometer expose seulement le compteur et la somme
# (http_server_requests_seconds_count/_sum), pas les buckets
# (http_server_requests_seconds_bucket) nécessaires au calcul de percentiles
# (histogram_quantile) utilisé dans le dashboard Grafana pour la latence p95.
management.metrics.distribution.percentiles-histogram.http.server.requests=true 
