# Force Prometheus, Grafana et Alertmanager à ne démarrer QUE sur le
# node pool "monitoring" (taint workload=observability), pas sur le
# pool "system" qui héberge l'application.
prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule

grafana:
  grafanaSpec:
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
  nodeSelector:
    workload: observability
  tolerations:
    - key: workload
      operator: Equal
      value: observability
      effect: NoSchedule
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule

kubeStateMetrics:
  kubeStateMetricsSpec:
    resources:
      requests:
        cpu: 25m
        memory: 100Mi
  nodeSelector:
      workload: observability
  tolerations:
    - key: workload
      operator: Equal
      value: observability
      effect: NoSchedule

prometheusOperator:
  nodeSelector:
      workload: observability
  tolerations:
    - key: workload
      operator: Equal
      value: observability
      effect: NoSchedule

  admissionWebhooks:
    patch:
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
    create:
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
