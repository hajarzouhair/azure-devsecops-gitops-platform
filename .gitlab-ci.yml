stages:
  - test
  - build
  - scan
  - push
  - sign
  - deploy

variables:
  IMAGE_NAME: "$ACR_LOGIN_SERVER/portfolio-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository


# ==========================================================
# 1. UNIT TESTS
# ==========================================================

unit_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21

  script:
    - mvn -B test

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 2. BUILD IMAGE
# ==========================================================

build:
  stage: build
  image: docker:24

  services:
    - docker:24-dind

  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker save "$IMAGE_NAME:$IMAGE_TAG" -o image.tar

  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 3. SAST
# ==========================================================

include:
  - template: Security/SAST.gitlab-ci.yml


# ==========================================================
# 4. CONTAINER SCAN
# ==========================================================

container_scan:
  stage: scan

  image:
    name: aquasec/trivy:0.66.0
    entrypoint: [""]

  needs:
    - build

  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --input image.tar

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 5. PUSH TO ACR
# ==========================================================

push_to_acr:
  stage: push

  image: docker:24

  services:
    - docker:24-dind

  needs:
    - build
    - container_scan

  script:
    - docker load -i image.tar
    - echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin
    - docker push "$IMAGE_NAME:$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 6. COSIGN + SBOM
# ==========================================================

sign_and_sbom:
  stage: sign

  image: docker:24

  services:
    - docker:24-dind

  needs:
    - push_to_acr

  variables:
    COSIGN_EXPERIMENTAL: "1"

  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore

  before_script:

    # Install Cosign
    - wget -O /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign

    # Install curl
    - apk add --no-cache curl

    # Install Syft
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    # Display versions
    - cosign version
    - syft version

  script:

    # Login to ACR
    - echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin

    # Pull exact image
    - docker pull "$IMAGE_NAME:$IMAGE_TAG"

    # Get immutable digest
    - IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:$IMAGE_TAG")

    - echo "Image digest:"
    - echo "$IMAGE_DIGEST"

    # Generate SBOM
    - syft "$IMAGE_DIGEST" -o spdx-json > sbom.json

    # Sign image using immutable digest
    - cosign sign --yes --registry-referrers-mode oci-1-1 "$IMAGE_DIGEST"

    # Create SBOM attestation
    - cosign attest --yes --type https://spdx.dev/Document --predicate sbom.json "$IMAGE_DIGEST"

  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 7. DEPLOY
# ==========================================================

# Deployment will be implemented through Argo CD.
# No kubectl apply is used here.

# ==========================================================
# 8. UPDATE MANIFEST (automatisation GitOps)
# ==========================================================
# ArgoCD ne fait QUE lire le repo — ce job est celui qui écrit le
# nouveau tag dans le manifest, à la place de le faire à la main.
# Boucle GitOps complète : build -> nouveau tag -> commit -> push
# -> ArgoCD détecte -> déploie, sans intervention humaine.
update_manifest:
  stage: deploy
  image: alpine:3.20
  needs:
    - sign_and_sbom

  before_script:
    - apk add --no-cache git curl bash

  script:
    - git config --global user.email "gitlab-ci@hajar-azure-project.local"
    - git config --global user.name "GitLab CI"

    # Authentification via le Project Access Token
    - git remote set-url origin "https://gitlab-ci-token:${GIT_PUSH_TOKEN}@gitlab.com/hajarzouhair/hajar-azure-project.git"

    - cd k8s/overlays/dev

    # Modifier uniquement le newTag de l'entrée portfolio-app existante
    - sed -i "s/^[[:space:]]*newTag:.*/  newTag: ${IMAGE_TAG}/" kustomization.yaml

    - cd ../../..

    - git add k8s/overlays/dev/kustomization.yaml

    - git commit -m "chore(dev) update image tag to ${IMAGE_TAG} [skip ci]" || echo "Rien a commit, tag deja a jour"

    - git push origin HEAD:master

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
