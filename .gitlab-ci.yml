stages:
  - test
  - build
  - scan
  - push
  - sign
  - ai_review
  - deploy

variables:
  IMAGE_NAME: "$ACR_LOGIN_SERVER/portfolio-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository


# ==========================================================
# 1. UNIT TESTS
# ==========================================================

unit_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21

  script:
    - mvn -B test

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 2. BUILD IMAGE
# ==========================================================

build:
  stage: build

  image: docker:24.0.5-cli

  services:
    - docker:24.0.5-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker info
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker save "$IMAGE_NAME:$IMAGE_TAG" -o image.tar

  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================================
# 3. SAST
# ==========================================================

include:
  - template: Security/SAST.gitlab-ci.yml


# ==========================================================
# 4. CONTAINER SCAN
# ==========================================================

container_scan:
  stage: scan
  image:
    name: aquasec/trivy:0.66.0
    entrypoint: [""]
  needs:
    - build
  script:
    - trivy image --format json --output trivy-report.json --input image.tar
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --input image.tar || true
    - echo "Trivy scan terminé"
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# ==========================================================
# 5. PUSH TO ACR
# ==========================================================

push_to_acr:
  stage: push

  image: mcr.microsoft.com/azure-cli:latest

  services:
    - docker:24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - build
    - container_scan

  id_tokens:
    AZURE_ID_TOKEN:
      aud: https://gitlab.com

  before_script:

    # ------------------------------------------------------
    # Install required tools
    # ------------------------------------------------------
    - tdnf install -y curl tar gzip

    # ------------------------------------------------------
    # Install Docker CLI manually
    # ------------------------------------------------------
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz -o docker.tgz
    - tar -xzf docker.tgz
    - mv docker/docker /usr/local/bin/docker
    - chmod +x /usr/local/bin/docker

    # ------------------------------------------------------
    # Verify tools
    # ------------------------------------------------------
    - az version
    - docker version

    # ------------------------------------------------------
    # Authenticate GitLab -> Azure using OIDC
    # ------------------------------------------------------
    - >
      az login
      --service-principal
      --username "$AZURE_CLIENT_ID"
      --tenant "$AZURE_TENANT_ID"
      --federated-token "$AZURE_ID_TOKEN"

    # ------------------------------------------------------
    # Authenticate Docker -> ACR
    # ------------------------------------------------------
    - az acr login --name acrhajarazureprojectdev

  script:

    # ------------------------------------------------------
    # Load image created during build
    # ------------------------------------------------------
    - docker load -i image.tar

    # ------------------------------------------------------
    # Verify image
    # ------------------------------------------------------
    - docker image inspect "$IMAGE_NAME:$IMAGE_TAG"

    # ------------------------------------------------------
    # Push image to ACR
    # ------------------------------------------------------
    - docker push "$IMAGE_NAME:$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# ==========================================================
# 6. COSIGN + SBOM
# ==========================================================

sign_and_sbom:
  stage: sign

  image: mcr.microsoft.com/azure-cli:latest

  services:
    - docker:24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COSIGN_EXPERIMENTAL: "1"

  needs:
    - push_to_acr

  id_tokens:
    AZURE_ID_TOKEN:
      aud: https://gitlab.com

    SIGSTORE_ID_TOKEN:
      aud: sigstore

  before_script:

    # ------------------------------------------------------
    # Install required tools
    # ------------------------------------------------------

    - tdnf install -y curl wget tar gzip

    # ------------------------------------------------------
    # Install Docker CLI
    # ------------------------------------------------------

    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz -o docker.tgz
    - tar -xzf docker.tgz
    - mv docker/docker /usr/local/bin/docker
    - chmod +x /usr/local/bin/docker

    # ------------------------------------------------------
    # Install Cosign
    # ------------------------------------------------------

    - wget -O /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign

    # ------------------------------------------------------
    # Install Syft
    # ------------------------------------------------------

    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    # ------------------------------------------------------
    # Verify tools
    # ------------------------------------------------------

    - az version
    - docker version
    - cosign version
    - syft version

    # ------------------------------------------------------
    # Authenticate GitLab -> Azure using OIDC
    # ------------------------------------------------------

    - >
      az login
      --service-principal
      --username "$AZURE_CLIENT_ID"
      --tenant "$AZURE_TENANT_ID"
      --federated-token "$AZURE_ID_TOKEN"

    # ------------------------------------------------------
    # Authenticate Docker -> ACR
    # ------------------------------------------------------

    - az acr login --name acrhajarazureprojectdev

  script:

    # ------------------------------------------------------
    # Pull exact image
    # ------------------------------------------------------

    - docker pull "$IMAGE_NAME:$IMAGE_TAG"

    # ------------------------------------------------------
    # Get immutable digest
    # ------------------------------------------------------

    - IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:$IMAGE_TAG")

    - echo "Image digest:"
    - echo "$IMAGE_DIGEST"

    # ------------------------------------------------------
    # Generate SBOM
    # ------------------------------------------------------

    - syft "$IMAGE_DIGEST" -o spdx-json > sbom.json

    # ------------------------------------------------------
    # Sign image using immutable digest
    # ------------------------------------------------------

    - >
      cosign sign
      --yes
      --registry-referrers-mode oci-1-1
      "$IMAGE_DIGEST"

    # ------------------------------------------------------
    # Create SBOM attestation
    # ------------------------------------------------------

    - >
      cosign attest
      --yes
      --type https://spdx.dev/Document
      --predicate sbom.json
      "$IMAGE_DIGEST"

  artifacts:
     paths:
      - sbom.json
    when: always
    expire_in: 30 days

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# ==========================================================
# 7. AI-SECURITY-REVIEW
# ==========================================================

ai_security_review:
  stage: ai_review

  image: python:3.12-slim

  id_tokens:
    AZURE_AI_REVIEW_TOKEN:
      aud: api://AzureADTokenExchange

  needs:
    - job: container_scan
      artifacts: true

    - job: sast
      artifacts: true

    - job: sign_and_sbom
      artifacts: true

  before_script:
    - pip install --no-cache-dir requests

  script:
    - python ci/ai_security_review.py

  artifacts:
    paths:
      - ai-security-report.md
    when: always
    expire_in: 30 days

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# ==========================================================
# 8. DEPLOY
# ==========================================================

# Deployment will be implemented through Argo CD.
# No kubectl apply is used here.

# ==========================================================
# 8. UPDATE MANIFEST (automatisation GitOps)
# ==========================================================
# ArgoCD ne fait QUE lire le repo — ce job est celui qui écrit le
# nouveau tag dans le manifest, à la place de le faire à la main.
# Boucle GitOps complète : build -> nouveau tag -> commit -> push
# -> ArgoCD détecte -> déploie, sans intervention humaine.

update_manifest:
  stage: deploy
  image: alpine:3.20

  needs:
    - sign_and_sbom

  before_script:
    - apk add --no-cache git python3

  script: |
    set -e

    git config --global user.email "gitlab-ci@hajar-azure-project.local"
    git config --global user.name "GitLab CI"

    git remote set-url origin "https://gitlab-ci-token:${GIT_PUSH_TOKEN}@gitlab.com/hajarzouhair/hajar-azure-project.git"

    cd k8s/overlays/dev

    python3 - <<'PY'
    from pathlib import Path
    import os
    import re

    path = Path("kustomization.yaml")
    image_tag = os.environ["IMAGE_TAG"]

    content = path.read_text()

    pattern = (
        r'(- name:\s*portfolio-app\s*\n'
        r'\s+newName:\s*acrhajarazureprojectdev\.azurecr\.io/portfolio-app\s*\n'
        r'\s+newTag:\s*)[^\s]+'
    )

    updated, count = re.subn(
        pattern,
        rf'\g<1>{image_tag}',
        content,
        count=1
    )

    if count != 1:
        raise SystemExit(
            "ERREUR: l'entrée image portfolio-app n'a pas été trouvée "
            "exactement une fois dans kustomization.yaml"
        )

    path.write_text(updated)
    print(f"Image tag mise à jour vers: {image_tag}")
    PY

    cd ../../..

    git add k8s/overlays/dev/kustomization.yaml

    git commit -m "chore(dev) update image tag to ${IMAGE_TAG} [skip ci]" || echo "Rien a commit, tag deja a jour"

    git push origin HEAD:master

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
